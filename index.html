<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kit Sosocial</title>
<meta name="description" content="Herramientas para las clases de música: piano, guitarra, bajo, metrónomo y diccionario de notas.">
<meta name="theme-color" content="#1C2230">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="iconos/icono-192.png" type="image/png">
<link rel="apple-touch-icon" href="iconos/icono-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kit Sosocial">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body data-view="piano">

<header class="top">
  <div class="bar1 wrap">
    <a class="brand" href="#piano"><span class="logo" aria-hidden="true"></span>Kit Sosocial</a>
    <div class="mini" role="group" aria-label="Metrónomo">
      <button type="button" id="miniPlay" class="mini-play" data-i18n-aria="metro_play">▶</button>
      <button type="button" id="miniMinus" class="mini-step" data-i18n-aria="bpm_down">−</button>
      <span class="mini-bpm"><b id="miniBpm">80</b> BPM</span>
      <button type="button" id="miniPlus" class="mini-step" data-i18n-aria="bpm_up">+</button>
      <span id="miniDot" class="mini-dot" aria-hidden="true"></span>
    </div>
    <div class="lang" role="group" aria-label="Idioma / Idioma">
      <button type="button" data-lang="es">ES</button><button type="button" data-lang="ca">CA</button>
    </div>
  </div>
  <nav class="tabs" aria-label="Secciones">
    <div class="wrap">
      <a href="#diccionario" data-i18n="tab_diccionario">Diccionario</a>
      <a href="#piano" data-i18n="tab_piano">Piano</a>
      <a href="#guitarra" data-i18n="tab_guitarra">Guitarra</a>
      <a href="#bajo" data-i18n="tab_bajo">Bajo</a>
      <a href="#metronomo" data-i18n="tab_metronomo">Metrónomo</a>
    </div>
  </nav>
</header>

<div class="progbar" id="progBar">
  <div class="wrap">
    <div class="plabel" data-i18n="progresion">Progresión</div>
    <div class="slots" id="slots"></div>
    <div class="ptools">
      <select id="presets" aria-label="Ejemplos"></select>
      <label class="ck"><span data-i18n="note_names">Notas</span> <select id="noteNames"></select></label>
      <button type="button" id="share" data-i18n="share">Compartir</button>
      <span id="shareMsg" class="sharemsg" role="status"></span>
    </div>
  </div>
</div>

<main id="view" class="wrap view"></main>

<footer class="wrap foot" data-i18n="footer">Kit Sosocial</footer>

<script src="js/nucleo/estado.js"></script>
<script src="js/nucleo/idioma.js"></script>
<script src="js/nucleo/acordes.js"></script>
<script src="js/nucleo/audio.js"></script>
<script src="js/metronomo.js"></script>
<script src="js/piano.js"></script>
<script src="js/guitarra.js"></script>
<script src="js/bajo.js"></script>
<script src="js/diccionario.js"></script>
<script src="js/app.js"></script>
</body>
</html>
